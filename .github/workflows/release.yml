# Zieht Versionen und README-Tabelle nach und veröffentlicht jedes Paket,
# dessen Version noch kein Release hat.
#
# Läuft bei jedem Push auf main und lässt sich unter Actions → Release → Run workflow
# auch von Hand starten. Für jedes Paket in themes/ und plugins/ wird die Version aus
# dem Kopf gelesen; fehlt das Release <paket>-v<version>, wird die ZIP gebaut und ein
# Release mit dem Text aus CHANGELOG.md angelegt (das Tag entsteht dabei automatisch).
name: Release

on:
  push:
    branches: [main]
    paths:
      - 'themes/**'
      - 'plugins/**'
      - 'build.sh'
      - 'CHANGELOG.md'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version aus dem Dateikopf in …_VERSION, Stable tag und README-Tabelle übernehmen.
      # Der Commit stammt vom GITHUB_TOKEN und löst deshalb keinen weiteren Lauf aus.
      - name: Versionen und README nachziehen
        run: |
          set -euo pipefail
          ./build.sh --sync
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -am 'Versionen und Download-Tabelle automatisch aktualisiert'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Neue Versionen veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./build.sh --list | while read -r package version; do
            tag="$package-v$version"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag: gibt es schon"
              continue
            fi

            ./build.sh "$package"

            awk -v h="## $package $version" '
              $0 == h { on = 1; next }
              on && /^## / { exit }
              on { print }
            ' CHANGELOG.md > notes.md
            if ! grep -q '[^[:space:]]' notes.md; then
              echo "$package $version" > notes.md
            fi

            gh release create "$tag" "dist/$package-$version.zip" \
              --target "$SHA" \
              --title "$package $version" \
              --notes-file notes.md \
              --latest=false
            echo "$tag: veröffentlicht"
          done
